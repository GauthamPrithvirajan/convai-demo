<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <script type="module" crossorigin src="./assets/index-Ul0gptL2.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BiLPwj0v.css">
    <style>

      body *{
        font-family: Arial, Helvetica, sans-serif;
        padding:0px; margin:0px;
      }

      a{
        text-decoration: none;
      }

      #eventAgenda{
        position:absolute;
        z-index:100;
        top:0px;
        left:0px;
        box-sizing: border-box;
        min-height:64px;
        min-width:320px;
        width:100%;
        background:rgba(255,255,255,0.6);
        border-bottom:1px solid rgba(255,255,255,1.0);
        display:flex;
        flex-flow:row wrap;
        padding:12px;
        gap:24px;
        justify-content: center;
        align-items: center;
        align-content: center;
      }

      #logo{
        width:80px;
        height:40px;
        background-image: url(assets/CGI_logo.svg);
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }

      #downloadButton{
        
        width:160px;
        height:40px;
        border-radius:24px;
        background:#5236ab;
        color:#ffffff;
        display:flex;
        justify-content: center;
        align-content: center;
        align-items: center;
        padding:0px 6px;
        
      }

      .separator{
        width:1px;
        height:48px;
        background: #aaaaaa;
      }

      #micButton{
        width:60px;
        height:60px;
        background:rgba(0,0,0,0.7);
        border:1px solid #000000;
        position: absolute;
        left:12px;
        bottom:27vh;
        border-radius:50%;
        z-index:100;
        background-image: url(assets/mic-svgrepo-com.svg);
        background-position: center;
        background-size: 32px 32px;
        background-repeat: no-repeat;
      }

      @media screen and (max-width: 626px) {
        .separator{
          display:none;
        }

        #eventAgenda{
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="eventAgenda">
      <div id="logo"></div>
      <div style="font-size: 24px;">APAC DC MIG LC FY2025</div>
      <div class="separator"></div>
      <a href="assets/MIGLeadershipConnect2025agenda.pdf" download><div id="downloadButton">Download Agenda</div></a>
    </div>

    <button id="micButton"></button>
    <div id="root"></div>
    <script type="text/javascript">
      const myDiv = document.getElementById('micButton');
      var listen = 0;

// Add a mousedown event listener to the div
myDiv.addEventListener('click', () => {
    console.log('Click on div!');

    if(listen == 0){
    // Create a new KeyboardEvent for the 't' key
    const keydownEvent = new KeyboardEvent('keydown', {
        key: 't',
        code: 'KeyT',
        keyCode: 84, // Deprecated, but often included for compatibility
        which: 84,   // Deprecated, but often included for compatibility
        bubbles: true,
        cancelable: true
    });

    // Dispatch the keydown event on the document body (or another target)
    document.body.dispatchEvent(keydownEvent);
    console.log('keydown event for "t" dispatched!');
    listen = 1;
    myDiv.style.backgroundImage = "url('assets/mic-off-svgrepo-com.svg')";
  }else if(listen == 1){

    // Create a new KeyboardEvent for the 't' key
    const keyupEvent = new KeyboardEvent('keyup', {
        key: 't',
        code: 'KeyT',
        keyCode: 84, // Deprecated, but often included for compatibility
        which: 84,   // Deprecated, but often included for compatibility
        bubbles: true,
        cancelable: true
    });

    // Dispatch the keydown event on the document body (or another target)
    document.body.dispatchEvent(keyupEvent);
    console.log('keyup event for "t" dispatched!');
    listen=0;
    myDiv.style.backgroundImage = "url('assets/mic-svgrepo-com.svg')";
  }
});

// Optional: Add a keydown listener to see if the event was triggered
document.body.addEventListener('keydown', (event) => {
    if (event.key === 't') {
        console.log('Key "t" was pressed (simulated)!');
    }
});

// Optional: Add a keydown listener to see if the event was triggered
document.body.addEventListener('keyup', (event) => {
    if (event.key === 't') {
        console.log('Key "t" was released (simulated)!');
    }
});

document.getElementById('micButton').addEventListener('contextmenu', function(e) {
    e.preventDefault(); // Prevents the default context menu from appearing
    // You can add other actions here if needed, e.g., a custom long-press handler
});
    </script>
    
  </body>
</html>
