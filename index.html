<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <script type="module" crossorigin src="./assets/index-Ul0gptL2.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BiLPwj0v.css">
    <style>

      body *{
        font-family: Arial, Helvetica, sans-serif;
        padding:0px; margin:0px;
      }

      a{
        text-decoration: none;
      }

      #eventAgenda{
        position:absolute;
        z-index:100;
        top:0px;
        left:0px;
        box-sizing: border-box;
        min-height:64px;
        min-width:320px;
        width:100%;
        background:rgba(255,255,255,0.6);
        border-bottom:1px solid rgba(255,255,255,1.0);
        display:flex;
        flex-flow:row wrap;
        padding:12px;
        gap:24px;
        justify-content: center;
        align-items: center;
        align-content: center;
      }

      #logo{
        width:80px;
        height:40px;
        background-image: url(assets/CGI_logo.svg);
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }

      #downloadButton{
        
        width:160px;
        height:40px;
        border-radius:24px;
        background:#5236ab;
        color:#ffffff;
        display:flex;
        justify-content: center;
        align-content: center;
        align-items: center;
        padding:0px 6px;
      }

      .separator{
        width:1px;
        height:48px;
        background: #aaaaaa;
      }

      #micButton{
        width:60px;
        height:60px;
        background:rgba(0,0,0,0.7);
        border:1px solid #000000;
        position: absolute;
        left:12px;
        bottom:27vh;
        border-radius:50%;
        z-index:100;
      }

      @media screen and (max-width: 626px) {
        .separator{
          display:none;
        }

        #eventAgenda{
          gap: 12px;
          top:6px;
        }
      }
    </style>
  </head>
  <body>
    <div id="eventAgenda">
      <div id="logo"></div>
      <div style="font-size: 24px;">APAC DC MIG LC FY2025</div>
      <div class="separator"></div>
      <a href="assets/MIGLeadershipConnect2025agenda.pdf" download><div id="downloadButton">Download Agenda</div></a>
    </div>

    <div id="micButton"></div>
    <div id="root"></div>
    <script type="text/javascript">
   document.addEventListener('DOMContentLoaded', () => {
  const myDiv = document.getElementById('micButton');

  myDiv.addEventListener('mousedown', () => {
    // Simulate keydown for 't'
    const keydownEvent = new KeyboardEvent('keydown', {
      key: 't',
      code: 'KeyT',
      bubbles: true // Allow event to bubble up the DOM tree
    });
    document.dispatchEvent(keydownEvent);
    console.log('Simulated keydown for "t"');
  });

  myDiv.addEventListener('mouseup', () => {
    // Simulate keyup for 't'
    const keyupEvent = new KeyboardEvent('keyup', {
      key: 't',
      code: 'KeyT',
      bubbles: true // Allow event to bubble up the DOM tree
    });
    document.dispatchEvent(keyupEvent);
    console.log('Simulated keyup for "t"');
  });

  // Optional: Listen for actual keydown/keyup events to confirm simulation
  document.addEventListener('keydown', (event) => {
    if (event.key === 't') {
      console.log('Actual keydown for "t" detected (simulated or real)');
    }
  });

  document.addEventListener('keyup', (event) => {
    if (event.key === 't') {
      console.log('Actual keyup for "t" detected (simulated or real)');
    }
  });
});
    </script>
    
  </body>
</html>
